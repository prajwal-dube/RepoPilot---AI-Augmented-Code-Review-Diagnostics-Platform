[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.1.0"
description = "Context-aware PR review and diagnostics"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "celery[redis]>=5.4,<6", "httpx>=0.27,<1", "qdrant-client>=1.12,<1.13", "langgraph>=0.2,<2", "openai>=1.50,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
include = ["repopilot*"]
